# Apache reverse proxy for the panel dashboard.
#
# The panel Fastify server listens on 127.0.0.1:4000 and serves both the
# static SvelteKit build (/) and the API (/api/*) plus a WebSocket (/ws).
# Apache fronts it for TLS and a real hostname.
#
# Enable the required modules once:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo systemctl reload apache2
#
# Install: copy to /etc/apache2/sites-available/panel.conf, edit ServerName,
#   sudo a2ensite panel && sudo systemctl reload apache2
#
# TLS: the simplest path is certbot —
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d panel.example.org
# which rewrites this vhost into a 443 block and adds the redirect below.

<VirtualHost *:80>
    ServerName panel.example.org

    # Redirect all plaintext traffic to HTTPS once TLS is set up. Comment
    # this out (and the whole 443 block) if you're running HTTP-only on a
    # trusted LAN.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/panel-error.log
    CustomLog ${APACHE_LOG_DIR}/panel-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName panel.example.org

    SSLEngine on
    # certbot fills these in; point them at your cert/key if managing by hand.
    SSLCertificateFile      /etc/letsencrypt/live/panel.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/panel.example.org/privkey.pem

    # Pass the browser's Host header through to Fastify unchanged.
    ProxyPreserveHost On

    # The WebSocket upgrade for /ws MUST be matched before the catch-all,
    # and MUST use the ws:// scheme (mod_proxy_wstunnel). The browser talks
    # wss:// to Apache; Apache talks ws:// to the local backend.
    ProxyPass        /ws  ws://127.0.0.1:4000/ws
    ProxyPassReverse /ws  ws://127.0.0.1:4000/ws

    # Everything else (static assets + /api) proxies over plain HTTP.
    ProxyPass        /    http://127.0.0.1:4000/
    ProxyPassReverse /    http://127.0.0.1:4000/

    ErrorLog ${APACHE_LOG_DIR}/panel-error.log
    CustomLog ${APACHE_LOG_DIR}/panel-access.log combined
</VirtualHost>
